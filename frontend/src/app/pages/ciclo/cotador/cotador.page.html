<h1>Cotador</h1>
<p class="muted">
  As licitações em Preparar › Cotação, as mesmas da Torre: com cotação no Licita ou com preço
  lançado no Compras.gov. As que perdem o prazo saem daqui.
</p>

@if (erro()) {
  <p class="erro">Não foi possível carregar as cotações agora.</p>
}

<app-data-table
  [colunas]="colunas"
  [linhas]="linhas()"
  [total]="total()"
  [estado]="estado()"
  [carregando]="carregando()"
  [chaveDe]="chaveDe"
  rotuloBusca="Buscar"
  placeholderBusca="Busca na descrição e nos itens…"
  mensagemVazia="Nenhuma licitação em cotação. Abra a cotação de uma salva (Oportunidades / Salvas)."
  (estadoMudou)="aoMudarEstado($event)"
  [linhaClicavel]="true"
  (linhaClicada)="abrirCotacao($event)"
>
  <ng-template appTabelaAcoes let-linha>
    <app-menu [itens]="acoesDe(linha)" [descricao]="'Ações da cotação ' + linha.chave" />
  </ng-template>
</app-data-table>
