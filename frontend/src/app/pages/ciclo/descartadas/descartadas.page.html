<h1>Descartadas</h1>
<p class="muted">
  Tudo que saiu do ciclo antes de participar do certame: a equipe tirou da lista, ou o prazo venceu,
  com ou sem cotação. Nada é apagado: abra o processo para ver o que aconteceu.
</p>

<form [formGroup]="filtros" (ngSubmit)="pesquisar()" class="form-grid" novalidate>
  <app-select label="Período" [options]="periodos" [opcaoVazia]="false" formControlName="periodo" />
  @if (escolhendoDatas()) {
    <app-date-picker label="De" formControlName="data_inicial" />
    <app-date-picker label="Até" formControlName="data_final" />
  }
  <app-select label="Motivo" [options]="motivos" formControlName="motivo" placeholder="Todos" />
  <app-input-text label="UASG" formControlName="uasg" placeholder="Ex.: 925001" />
  <app-select label="UF" [options]="ufs" formControlName="uf" />
  <div class="form-acoes">
    <app-button type="submit">Pesquisar</app-button>
  </div>
</form>

@if (erro()) {
  <p class="erro">Não foi possível carregar as descartadas agora.</p>
}

<app-data-table
  [colunas]="colunas"
  [linhas]="linhas()"
  [total]="total()"
  [estado]="estado()"
  [carregando]="carregando()"
  [chaveDe]="chaveDe"
  rotuloBusca="Buscar"
  placeholderBusca="Busca no objeto e nos itens…"
  mensagemVazia="Nenhuma oportunidade descartada no período."
  (estadoMudou)="aoMudarEstado($event)"
>
  <ng-template appTabelaAcoes let-linha>
    <app-menu [itens]="acoesDe(linha)" [descricao]="'Ações do processo ' + linha.chave" />
  </ng-template>
</app-data-table>
