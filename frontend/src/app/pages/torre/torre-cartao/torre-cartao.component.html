<article class="cartao" [attr.data-nivel]="nivel()">
  <button
    type="button"
    class="cartao-abrir"
    (click)="abrir.emit(cartao())"
    [attr.title]="cartao().objeto"
  >
    @if (!semEtapa()) {
      <span class="etapa" [attr.data-estagio]="cartao().estagio" [attr.data-etapa]="cartao().etapa">
        <i aria-hidden="true"></i>{{ cartao().etapa_rotulo }}
      </span>
    }
    <span class="local">{{ local() }}</span>
    <span class="orgao">{{ orgao() }}</span>
    <span class="compra">{{ compra() }}</span>

    @if (linha(); as texto) {
      <span class="linha">{{ texto }}</span>
    }
    @if (perdendo(); as texto) {
      <span class="perdendo">{{ texto }}</span>
    }

    @if (trilha().length > 1) {
      <span class="trilha" aria-label="Próximas etapas">
        @for (passo of trilha(); track passo.rotulo; let primeiro = $first) {
          @if (!primeiro) {
            <span aria-hidden="true">›</span>
          }
          <span [class.atual]="passo.atual">{{ passo.atual ? '● ' : '' }}{{ passo.rotulo }}</span>
        }
      </span>
    }
  </button>

  @if (prazo() || cartao().etiquetas.length) {
    <div class="etiquetas">
      @if (prazo(); as p) {
        <span class="etiqueta" [attr.data-nivel]="p.urgente ? 'aviso' : 'neutro'">{{
          p.texto
        }}</span>
      }
      @for (etiqueta of cartao().etiquetas; track etiqueta.texto) {
        <span class="etiqueta" [attr.data-nivel]="etiqueta.nivel">{{ etiqueta.texto }}</span>
      }
    </div>
  }
</article>
