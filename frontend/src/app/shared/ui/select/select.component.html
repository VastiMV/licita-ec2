<label class="field" [for]="selectId">
  @if (label()) {
    <span class="field-label">{{ label() }}</span>
  }
  <select
    [id]="selectId"
    [disabled]="disabled()"
    [class.has-error]="error()"
    (change)="handleChange($any($event.target).value)"
    (blur)="handleBlur()"
  >
    <!-- A seleção vai em cada <option> ([selected]), não em <select [value]>:
         o [value] do select é aplicado antes de o @for criar as opções, e o
         navegador cai na primeira — só dava certo quando o valor era vazio. -->
    @if (opcaoVazia()) {
      <option value="" [selected]="value() === ''">{{ placeholder() }}</option>
    }
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">
        {{ option.label }}
      </option>
    }
  </select>
  @if (error()) {
    <span class="field-error">{{ error() }}</span>
  }
</label>
