<button
  type="button"
  class="trigger"
  (click)="alternar()"
  [attr.aria-expanded]="aberto()"
  aria-haspopup="menu"
  aria-label="Menu de conta"
>
  @if (foto()) {
    <img class="inicial foto" [src]="foto()" alt="" />
  } @else {
    <span class="inicial" aria-hidden="true">{{ inicial() }}</span>
  }
</button>

@if (aberto()) {
  <div class="dropdown" role="menu">
    <div class="dropdown-header">
      <strong class="nome">{{ usuario()?.nome || 'Usuário' }}</strong>
      @if (usuario()?.email) {
        <span class="email">{{ usuario()!.email }}</span>
      }
    </div>

    <div class="dropdown-divider"></div>

    <button type="button" class="dropdown-item" (click)="editarPerfil()">
      <app-icon name="edit" />
      Editar perfil
    </button>

    <label class="dropdown-item">
      <app-icon name="user" />
      Trocar foto
      <input class="sr-only" type="file" accept="image/*" (change)="escolherFoto($event)" />
    </label>

    @if (foto()) {
      <button type="button" class="dropdown-item" (click)="tirarFoto()">
        <app-icon name="trash" />
        Tirar foto
      </button>
    }

    <button type="button" class="dropdown-item danger" (click)="sair()">
      <app-icon name="logout" />
      Sair
    </button>
  </div>
}
