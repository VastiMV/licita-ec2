name: "Teste: desligar"

# Desliga o ambiente de teste e libera a memória da máquina. A produção não
# é tocada. Ver deploy/ec2/README.md.
on:
  workflow_dispatch:
    inputs:
      apagar_dados:
        description: "Apagar também os dados do teste (banco do teste volta vazio)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: teste-ec2
  cancel-in-progress: false

jobs:
  desligar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir segredos
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::Faltam os segredos EC2_HOST e/ou EC2_SSH_KEY — ver deploy/ec2/README.md."
            exit 1
          fi

      - name: Chave SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Desligar o teste
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          APAGAR: ${{ inputs.apagar_dados && '--apagar-dados' || '' }}
        run: |
          ssh -i ~/.ssh/ec2.pem "ubuntu@$EC2_HOST" \
            "if [ -x /opt/licita-teste/teste.sh ]; then sudo /opt/licita-teste/teste.sh desligar $APAGAR; \
             else echo 'O teste nunca foi ligado — nada a desligar.'; fi"
