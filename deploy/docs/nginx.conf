# Só o site estático da documentação, em /documentacao/. Quem decide se a
# pessoa pode ver é o Caddy (forward_auth), antes de chegar aqui.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /documentacao {
    return 301 /documentacao/;
  }

  location /documentacao/ {
    try_files $uri $uri/ $uri.html =404;
    error_page 404 /documentacao/404.html;
  }
}
